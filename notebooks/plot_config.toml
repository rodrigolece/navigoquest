# Figure output settings shared by all notebooks.
# Read by navigoquest.utils.figures.save_figure every time a figure is saved,
# so changes apply without restarting the kernel.

[output]
enabled = true            # false: notebooks only display figures, nothing is written
dir = "../figures"        # relative to this file (i.e. the repository's figures/ folder)
formats = ["pdf", "svg"]  # every figure is written once per format; add "png" for previews
bbox_inches = "tight"     # crop to the drawn content, as in the notebook display; "" for the full canvas
dpi = 300                 # only affects rasterised elements inside the vector files
transparent = false

[source_data]
enabled = true            # write figures/source_data/<name>.xlsx (one tab per panel) for each figure
auto_extract = true       # extract drawn data for panels without explicitly attached tables
workbook = "SourceData.xlsx"  # combined file built by 11_source_data.ipynb (in the output dir)

# Output file names. The left-hand side is the key used in the notebook
# (save_figure(fig, "<key>")); the right-hand side is the name of the written files
# and of the sheet in SourceData.xlsx. Figures not listed here keep their key as name.
# Fill in the supplementary figure numbers as needed.
[names]
