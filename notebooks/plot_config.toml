# Statistical tests, reported as the journal asks:
#   Statistic (df) = value, p = value, effect size = value, 95% CI = [low, high]
# Written by navigoquest.utils.stat_report.save_tests: <dir>/<name>.csv (all numbers)
# and <dir>/<name>.txt (one formatted sentence per test).
[statistical_tests]
enabled = true
dir = "../statistical_tests"   # relative to this file (i.e. the repository's statistical_tests/ folder)
ci_level = 0.95
